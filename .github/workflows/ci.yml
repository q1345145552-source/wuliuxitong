name: CI - Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          # ⚠️ 前端也必须用 npm ci（2026-08-28 改）。
          # 原来是 npm install：它会自行解析出比锁文件更新的小版本，还会顺手改写
          # package-lock.json —— 于是「锁文件和 package.json 对不上」这类问题在 CI 里
          # 被悄悄抹平，等到 Dockerfile.web 的 npm ci 才炸，而那时已经在部署流程里了。
          # 用 npm ci 才和镜像里装的是同一份。
          npm ci --prefix apps/web

      # 后端类型检查要用 Prisma 生成出来的类型。
      # CI 装依赖用的是 `npm ci --ignore-scripts`，不会自动生成，必须显式跑一次，
      # 否则后端检查会报一堆「@prisma/client 没有导出 PrismaClient」（实测过）。
      - name: Generate Prisma client
        run: npm run db:generate

      # 后端类型检查（2026-08-27 加）。
      # 以前 CI 只查前端，后端一路带着十几个报错也能合并、也能部署 ——
      # 真出问题时全被淹在噪音里。2026-08-27 把后端清到 0 个错，从此不许再退回去。
      - name: TypeScript check (backend)
        run: npx -p typescript tsc --noEmit --project apps/api/tsconfig.json

      - name: TypeScript check (frontend)
        run: npx -p typescript tsc --noEmit --project apps/web/tsconfig.json

      # 自测脚本的类型检查（2026-08-28 加）。
      # 以前 scripts/ 不在任何 tsconfig 里，等于从来没查过 ——
      # test-ai-answer-numbers.ts 里有个早就不存在的 Order 类型，
      # 因为类型会被擦除所以脚本照跑不误，一直没人发现（复核时才抓到）。
      - name: TypeScript check (test scripts)
        run: npx -p typescript tsc --noEmit --project tsconfig.scripts.json

      # 登录限流（2026-08-29 加，老板拍板 30 分钟 20 次）。
      # 登录本来就有限流，但按 IP 算 —— 换个 IP 计数就从 0 开始，
      # 100 台机器猜同一个账号一天能试 144 万次。加这道按账号算的之后封顶 960 次。
      - name: Test login throttle
        run: npm run test:login-throttle

      - name: Test shipment list display
        run: npm run test:shipment-list-display

      - name: Test admin shipment detail
        run: npm run test:admin-shipment-detail

      # 打开另一个登录标签页不应注销现有工作台；成功换账号才清旧订单缓存。
      # 真调浏览器会话模块，用 Map localStorage 覆盖三端、旧 key、异常存储；不连库。
      - name: Test login session stability
        run: npm run test:session-stability

      # 真正的受保护请求 401 才结束对应会话，迟到旧请求不得踢掉新登录。
      # 使用原生 Response + 合成 fetch/localStorage，不发网络请求。
      - name: Test request-scoped session expiry
        run: npm run test:session-api

      # 从柜子里卸货（2026-08-29 加，上线后排查出的两个老 bug）。
      # ① 卸柜之后父单状态永远冻住 —— 装错柜卸下来，客户还看着「已签收」
      # ② 删柜子把子单变成孤儿、父单件数方数重量永远回不来
      - name: Test unload from container
        run: npm run test:unload

      # 员工改客户派送地址（2026-08-29 加，老板要求「尾端这要加个编辑」）。
      # 尾端地址那一栏原来只能加和删 —— 电话打错一位就得整条删掉重加，
      # 客户的默认地址标记也跟着没了。这个脚本真注册路由、真调 handler，
      # 用假 prisma 全程不连库，盯：公司隔离、查不到要 404、没传 label 不许清掉。
      - name: Test client address update
        run: npm run test:address-update

      # 前端数字兜底（2026-08-29 加）。
      # 老板从第一天起反复报的就是「箱数没填，系统自己猜成 1」——
      # 后端一轮轮收紧，但前端在发送之前就把空值换成了数字，后端的闸挡不到。
      # 这个脚本盯：空着不许被翻译成 0、失败不许关弹窗、总方数不许静默变 68。
      - name: Test frontend number guards
        run: npm run test:frontend-guards

      # 算钱数值校验（2026-08-29 加，第九轮复核确认的 5 组）。
      # 这一批的共同点是**不会报错、只会安安静静算错钱**：
      # 单价 0.001 被 Decimal(10,2) 存成 0.00（这一柜白送）、
      # 尺寸多一位小数导致客户对不上账（实测 ¥850/方 差 ¥5.10）、
      # 普通版集货 2.5 件能进 Int 列。
      - name: Test money guards
        run: npm run test:money-guards

      # 产品行校验（2026-08-29 加）。
      # 复核真调接口测出来：每箱填 0/-3/1.5 全部 200 放行，
      # 而且前端三处 `Number(...) || 1` 会把「箱数没填」悄悄变成 1 箱 ——
      # 老板最早报的那个「箱数被系统猜成 1」改了后端也还在。
      # 前后端两份实现一份口径，所以这个脚本两边都测。
      - name: Test product row guard
        run: npm run test:product-rows

      # 批量下单解析的自测（2026-08-28 接进 CI）。
      # 这个脚本会跑 100 张单 / 300 行明细，覆盖多产品合并、公共字段继承、
      # 方数与重量汇总、以及十几种填错的拦截。以前只能手动跑，容易忘。
      - name: Test batch order parser
        run: npm run test:batch-import

      # 整柜拆柜派送清单导出（2026-08-28 加）。
      # 老板实测「多尺寸的单子长宽高三格全空白」，而这个模块一个测试都没有。
      # 一票货里有多个不同尺寸时，后端给的是「60/50」这种字符串，
      # 前端原来只认数字、字符串一律丢掉 —— 五项里第 2 项就是盯这个的。
      - name: Test lastmile dispatch export
        run: npm run test:lastmile-export

      # 普通版集货「还能不能删」那把尺子（2026-08-28 加）。
      # 「删整张预报单」原来一道检查都没有：已付款也照删、级联把货物明细一起删光、
      # 钱一分不退，而且货删完之后「撤销付款」会 400，退款的口子也跟着封死。
      - name: Test consolidation delete guard
        run: npm run test:consolidation-delete

      # 接口响应格式（2026-08-28 加）。
      # 契约（docs/api-contract.md 第 2、3 节）要求成功和失败都带
      # errors / requestId / timestamp，但全局异常处理原来自己拼 { code, message }，
      # 同一个系统里两种错误格式。第 4 项会扫全后端，
      # 逮住任何绕开 ok()/fail() 自己拼响应体的地方。
      - name: Test API response shape
        run: npm run test:api-response

      # 加锁顺序（2026-08-29 加）。
      # 查两件事：① 第一条写语句必须排在第一把锁后面（不然锁等于白加）；
      # ② 同一模块所有事务的加锁顺序一致（方向相反会死锁）。
      # 起因：我上一轮用正则扫「FOR UPDATE 的先后」得出「锁序统一」，结论是错的 ——
      # 正则看不见「锁之前已经写了什么」，管理员强改就是先写产品行才加锁。
      - name: Test lock order
        run: npm run test:lock-order

      # AI 答复的数字校验（2026-08-28 加）。
      # 覆盖三件事：模型润色时改了数字要被拦下、「今天/本月」按北京时间算、
      # 时间窗按下单时间而不是最后更新时间。
      # ⚠️ 故意跑两个时区：生产容器是 UTC、开发机在中国是 UTC+8，
      # 时区那条 bug 只在 UTC 下暴露 —— 这就是它反复"本地测没问题、线上还是错"的原因。
      - name: Test AI answer numbers
        run: npm run test:ai-numbers

      # AI 聊天接口的限流与长度校验（2026-08-28 加）。
      # 这个接口每条消息固定调两次 DeepSeek，是全系统唯一直接花钱的地方。
      # 脚本只跑「被拦下」的路径，全程不连数据库、不调 DeepSeek。
      - name: Test AI chat limits
        run: npm run test:ai-limits

      # DeepSeek 调用超时（2026-08-28 加）。
      # 在本机起一个「只收不回」的假服务器冒充 DeepSeek，验证客户端会自己断开。
      # 不连真的 DeepSeek、不花钱。
      - name: Test DeepSeek timeout
        run: npm run test:ai-timeout

      # 整柜询价列表分页参数（2026-09-01 写的脚本，当时漏了没接进 CI —— 2026-09-03 补）。
      - name: Test FCL inquiry pagination
        run: npm run test:fcl-inquiries

      # 客户端订单分组口径（2026-09-03 加）。
      # 这个口径一天之内被老板改了两次（早上拆出「已到仓」、下午把「正在卸柜」退回在途），
      # 一个测试都没有。31 个状态逐个真调 GET /client/orders 断言，
      # 外加一道全覆盖闸：以后往海运/陆运流程加状态却忘了归类，这里当场红。
      - name: Test client status group
        run: npm run test:status-group

      - name: Test attention filter and client pagination
        run: npm run test:attention-filter

      - name: Build frontend
        run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
