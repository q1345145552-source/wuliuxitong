apply plugin: 'com.android.application'

// 正式包的签名钥匙（2026-10-05）：放在仓库外面 ~/.xiangtai-app/（钥匙丢了，已经装的 app 就再也推不了更新，只能卸了重装）。
// 别的电脑打包时用 XT_KEYSTORE_PROPS 指到那份 keystore.properties；找不到就打出没签名的包（装不上，但不会拿错钥匙）
def keystorePropsFile = file(System.getenv("XT_KEYSTORE_PROPS") ?: "${System.getProperty("user.home")}/.xiangtai-app/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "com.xianlianth.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xianlianth.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                // storeFile 写相对路径就按 keystore.properties 所在的文件夹找（换电脑时两个文件放一起就行）
                def store = new File(keystoreProps["storeFile"])
                storeFile store.isAbsolute() ? store : new File(keystorePropsFile.parentFile, keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProps["storeFile"]) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 正式包闸门（Codex 10-05 复审）：打正式包前查一遍要装进包里的 capacitor.config.json，
// 网址不是线上、开了明文、开了网页调试口，一律不让打（测试时在终端里设的 XT_APP_URL 忘了清，也打不出错包）
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    doFirst {
        def cfgFile = file("src/main/assets/capacitor.config.json")
        def cfg = new groovy.json.JsonSlurper().parse(cfgFile)
        def problems = []
        if (cfg.server?.url != "https://xianlianth.com") problems << "打开的网址是 ${cfg.server?.url}"
        if (cfg.server?.cleartext) problems << "开了明文 http"
        if (cfg.android?.webContentsDebuggingEnabled) problems << "开了网页调试口"
        if (!problems.isEmpty()) throw new GradleException("正式包配置不对：" + problems.join("；") + "。请用 npm run apk:release 打包")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
