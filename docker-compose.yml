# 本地或云服务器一键启动：前端 3000 + 后端 3001 + PostgreSQL 5432 + Redis 6379
# 使用：复制 env.example 为 .env 并填写后执行：docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: xiangtai-postgres
    ports:
      # 宿主机 5433 → 容器 5432，避开本机已有的 Postgres（5432）
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiangtai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xiangtai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-xiangtai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xiangtai} -d ${POSTGRES_DB:-xiangtai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xiangtai-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-xiangtai_redis_dev}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-xiangtai_redis_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    user: root  # 容器以 root 运行，避免 /images 目录权限问题
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      # 2026-08-05：原来是 "3001:3001"，等于对整个互联网开放。
      # 任何人直接连 http://<服务器IP>:3001 就绕过了 nginx —— 没有 HTTPS（账号密码明文过网络），
      # 也绕过了 nginx 填的 X-Real-IP（限流靠它认人，见 core/rate-limit.ts）。
      # 绑到 127.0.0.1 后只有服务器自己连得上，nginx 正是从 127.0.0.1:3001 转发的，不受影响。
      - "127.0.0.1:3001:3001"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_API_BASE_URL: ${DEEPSEEK_API_BASE_URL:-https://api.deepseek.com/chat/completions}
      # ⚠️ 2026-08-28：AI 的四个上限必须在这里透传，否则改 .env 不会进容器，
      # 只会一直用代码里的默认值（改了没反应，还很难查）。默认值见 env.example。
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-}
      AI_CHAT_MAX_PER_MINUTE: ${AI_CHAT_MAX_PER_MINUTE:-}
      AI_CHAT_MAX_PER_DAY: ${AI_CHAT_MAX_PER_DAY:-}
      AI_CHAT_MAX_MESSAGE_CHARS: ${AI_CHAT_MAX_MESSAGE_CHARS:-}
      # 2026-10-02 客服对话的浏览器系统通知（cs-chat/push.ts）。同上：不在这里透传，改 .env 进不了容器
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      IMAGES_DIR: /images
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-xiangtai}:${POSTGRES_PASSWORD:-xiangtai_dev}@postgres:5432/${POSTGRES_DB:-xiangtai}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-xiangtai_redis_dev}@redis:6379
    volumes:
      - ./data/images:/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 -T 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      # 2026-08-05：同 api，改为只绑本机；nginx 从 127.0.0.1:3000 转发，不受影响
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 -T 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
